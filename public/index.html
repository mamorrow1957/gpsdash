<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gpsdash</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>gpsdash</h1>
    <p class="subtitle">Status dashboard for ntp.local</p>
  </header>
  <main>
    <p id="error-banner" class="error-banner" hidden></p>
    <div class="panels">
      <section>
        <h2>GPS</h2>
        <div id="gps-panel">Loading…</div>
      </section>
      <section>
        <h2>NTP</h2>
        <div id="ntp-panel">Loading…</div>
      </section>
    </div>
    <section>
      <h2>Sources</h2>
      <div id="sources-panel">Loading…</div>
    </section>
  </main>
  <script src="dashboard.js"></script>
</body>
</html>
